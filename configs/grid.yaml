# Policy-table grid (SPEC §4.5). The spec fixes the number of points per axis (5 x 3 x 5 x 3 = 225)
# and N_rep = 20; placing the nodes uniformly over [0, 1] is our reading (docs/ENGINEERED.md, P1).
# The final size is the human's decision (reports/perf.md proposes options).

axes:
  sugar: [0.0, 0.25, 0.5, 0.75, 1.0]
  bitter: [0.0, 0.5, 1.0]
  looming: [0.0, 0.25, 0.5, 0.75, 1.0]
  hunger: [0.0, 0.5, 1.0]
n_rep: 20
shard_points: 25       # grid points per parquet shard (resume granularity)
seed_base: 8000000
