# Policy-table grid. Decision D27: grid B, 7 x 5 x 7 x 5 = 1225 points (SPEC §4.5 default was
# 5 x 3 x 5 x 3); tables serve RQ3/RQ4 only. Nodes are uniform over [0, 1] (docs/ENGINEERED.md, P1).

axes:
  sugar: [0.0, 0.166667, 0.333333, 0.5, 0.666667, 0.833333, 1.0]
  bitter: [0.0, 0.25, 0.5, 0.75, 1.0]
  looming: [0.0, 0.166667, 0.333333, 0.5, 0.666667, 0.833333, 1.0]
  hunger: [0.0, 0.25, 0.5, 0.75, 1.0]
n_rep: 20              # connectome: one session of 20 repeats per point
shard_points: 25       # grid points per parquet shard (resume granularity)
seed_base: 8000000

# Jev tables (PREREG §7, decision D54): two passes of 5 repeats, at least 12 hours apart; every
# row carries a `session` column. Bucketed modes query unique level combinations only (D47).
jev:
  n_rep_per_session: 5
  sessions: 2
  min_gap_hours: 12
