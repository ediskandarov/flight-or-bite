# Environment (SPEC §3). Every number is the spec's default. Changeable only before
# preregistration (SPEC §8).

energy_start: 50.0
energy_max: 100.0
max_trials: 500

p_food: 0.5
sugar_range: [0.2, 1.0]        # sugar ~ U when food is present, else 0
p_toxic: 0.25                  # given that food is present (see docs/ENGINEERED.md, V1)
bitter_toxic_range: [0.3, 1.0]
bitter_safe_range: [0.0, 0.1]

p_threat: 0.2
looming_threat: {mean: 0.7, sd: 0.2}     # clip(N(mean, sd)) to [0, 1]
looming_safe: {mean: 0.2, sd: 0.2}

metabolism: 1.0
eat_gain: 12.0                 # + eat_gain * sugar
toxic_cost: 15.0               # - toxic_cost * bitter, if the food is toxic
escape_cost: 3.0
p_death_eat: 0.6               # under a real threat
p_death_idle: 0.3

deadline_ms: null              # option: a slower decision is replaced by IDLE

seeds:
  dev: [0, 999]
  test: [100000, 100999]
