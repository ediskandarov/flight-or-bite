# v1 (2026-09-20): approved by the spec's author with edits; NOT tuned on dev. Frozen by hash in PREREG.md.
#
# bucketed (D7): identical to `naive` except that every number is replaced by a named level — the
# vendor's advice for jev-1.13. Five equal-width levels, fixed before any data was seen.
mode: bucketed
version: v1
instructions: "Which action should the agent take on this trial?"
criteria:
  EAT: null
  ESCAPE: null
  IDLE: null
buckets:             # upper bound (inclusive for the last) -> level name
  - [0.2, "very low"]
  - [0.4, "low"]
  - [0.6, "medium"]
  - [0.8, "high"]
  - [1.0, "very high"]
zero_label: "none"   # used for a value of exactly 0
