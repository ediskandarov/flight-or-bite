[project]
name = "flight-or-bite"
version = "0.0.1"
description = "Food-vs-threat arbitration: LIF simulation of the Drosophila connectome vs. Jev (TypeSafe AI)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "brian2>=2.9.0",
    "cython>=3.1.3",
    "httpx>=0.27",
    "numba>=0.67.0",
    "numpy>=1.26",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pydantic>=2.6",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0",
    "rich>=13.7",
    "scipy>=1.17.1",
    "setuptools>=84.0.0",
    "torch>=2.14.0",
    "typer>=0.12",
]

[project.scripts]
fob = "flight_or_bite.cli.app:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flight_or_bite"]

[tool.uv]
# SPEC §10: Apple Silicon wheels only. The lock file is resolved for this platform alone.
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["brian2: compiles and runs the Brian2 reference (slow on first run)"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
# ruff 0.16.8 was seen reformatting the Python block inside SPEC.md; Markdown is not ruff's to edit.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/flight_or_bite/lif/perf_report.py" = ["E501"]  # Markdown report template
"src/flight_or_bite/eval/run_eval.py" = ["E501"]  # Markdown report template
"src/flight_or_bite/policy_table/table.py" = ["E501"]
"src/flight_or_bite/policy_table/cli_ops.py" = ["E501"]
"src/flight_or_bite/lif/trial.py" = ["E501"]
"src/flight_or_bite/validation/gates_m3.py" = ["E501"]
"src/flight_or_bite/validation/run_gates.py" = ["E501"]
"src/flight_or_bite/cli/app.py" = ["E501"]
"scripts/*" = ["E501"]  # one-off exploratory scripts: wide literal records

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
