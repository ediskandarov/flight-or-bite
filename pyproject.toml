[project]
name = "flight-or-bite"
version = "0.0.1"
description = "Food-vs-threat arbitration: LIF simulation of the Drosophila connectome vs. Jev (TypeSafe AI)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "pydantic>=2.6",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0",
    "rich>=13.7",
    "typer>=0.12",
]

[project.scripts]
fob = "flight_or_bite.cli.app:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flight_or_bite"]

[tool.uv]
# SPEC §10: Apple Silicon wheels only. The lock file is resolved for this platform alone.
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# ruff 0.16.8 was seen reformatting the Python block inside SPEC.md; Markdown is not ruff's to edit.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
